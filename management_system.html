@keyframes shimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.login-glow {
  position: relative;
  overflow: hidden;
}

/* живе світіння позаду */
.login-glow::before {
  content: "";
  position: absolute;
  inset: -40px;
  background:
    radial-gradient(circle at 20% 30%, rgba(110,168,254,.35), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(157,255,163,.25), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 60%);
  filter: blur(20px);
  animation: floatGlow 6s ease-in-out infinite;
  z-index: 0;
}

/* легке мерехтіння поверх */
.login-glow::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0.05),
    rgba(255,255,255,0.02),
    rgba(255,255,255,0.06)
  );
  background-size: 200% 200%;
  animation: shimmer 6s linear infinite;
  opacity: 0.4;
  z-index: 0;
}

.login-content {
  position: relative;
  z-index: 1;
}

body {

/* базовий глибокий фон (ти вже маєш, але підсилюємо) */
body::before {
  content: "";

/* легке “живе мерехтіння” поверх */

// SHA-256
async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

// SESSION
function setSession(user) {
  sessionStorage.setItem(AUTH_KEY, JSON.stringify({
    username: user.username,
    t: Date.now()
  }));
}

function getSession() {
  try { return JSON.parse(sessionStorage.getItem(AUTH_KEY)); }
  catch { return null; }
}

function clearSession() {
  sessionStorage.removeItem(AUTH_KEY);
}

function isAuth() {
  return !!getSession();
}

// UI LOCK
function lockUI() {
  const app = document.querySelector('#app');
  if (app) app.style.display = 'none';
}

function unlockUI() {
  const app = document.querySelector('#app');

// ===================== BASE UTILS =====================

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtDateTime = d => new Date(d).toLocaleString('uk-UA');

const emailRx = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const ipv4Rx = /^(25[0-5]|2[0-4]\d|[01]?\d\d?)(\.(25[0-5]|2[0-4]\d|[01]?\d\d?)){3}$/;
const ipv6Rx = /^([\da-f]{1,4}:){7}[\da-f]{1,4}$/i;

// notify
function notify(msg) {
  const n = document.createElement('div');
  n.className = 't';
  n.textContent = msg;

  const box = document.querySelector('#toast');
  if (box) box.appendChild(n);

  setTimeout(() => n.remove(), 3500);
}

// helpers
function maskIp(ip){
  if(!ip) return '';
  if(ip.includes('.')){
    const p = ip.split('.');
    return `${p[0]}.${p[1]}.***.***`;
  }
  if(ip.includes(':')){
    return ip.split(':').slice(0,4).join(':') + ':****';
  }
  return ip;
}

function parseDuration(amount, unit){
  amount = Math.max(1, parseInt(amount||1,10));
  const map = {
    minutes: 60000,
    hours: 3600000,
    days: 86400000
  };
  return amount * (map[unit] || 60000);
}

function countdownStr(until){
  const ms = until - now();
  if(ms <= 0) return 'закінчено';
  const s = Math.floor(ms/1000)%60;
  const m = Math.floor(ms/60000)%60;
  const h = Math.floor(ms/3600000)%24;
  const d = Math.floor(ms/86400000);
  return `${d?d+'д ':''}${h?h+'г ':''}${m?m+'хв ':''}${s}с`;
}

<script>
// ===================== STORAGE =====================

const DB_KEY = 'moderation.users.v1';
const LOG_KEY = 'moderation.audit.v1';

const DB = {
  getAll() {
    try { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
    catch { return []; }
  },
  saveAll(data) {
    localStorage.setItem(DB_KEY, JSON.stringify(data));
  },
  upsert(user) {
    const all = this.getAll();
    const i = all.findIndex(u => u.id === user.id);
    if (i >= 0) all[i] = user;
    else all.push(user);
    this.saveAll(all);
  },
  remove(ids) {
    const all = this.getAll().filter(u => !ids.includes(u.id));
    this.saveAll(all);
  }
};

const AUDIT = {
  all() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
    catch { return []; }
  },
  add(evt) {
    const all = this.all();
    all.unshift(evt);
    localStorage.setItem(LOG_KEY, JSON.stringify(all.slice(0, 2000)));
  },
  clear() {
    localStorage.removeItem(LOG_KEY);
  }
};

// ===================== STATE =====================

const state = {
  search: '',
  filterStatus: 'all',
  filterRole: 'all',
  selected: new Set(),
  maskIp: false
};

// ===================== FILTER =====================

function filteredUsers() {
  const q = state.search.toLowerCase();

  return DB.getAll().filter(u => {
    const matchQ =
      !q ||
      [u.id, u.name, u.email, u.ip, u.note, u.status]
        .some(x => String(x || '').toLowerCase().includes(q));

    const statusOk =
      state.filterStatus === 'all' || u.status === state.filterStatus;

    const roleOk =
      state.filterRole === 'all' || u.role === state.filterRole;

    return matchQ && statusOk && roleOk;
  });
}
</script>

<script>
// ===================== РЕНДЕР =====================

function render() {
  const list = filteredUsers();
  const tbody = $('#tbody');
  const count = $('#count');

  if (count) {
    count.textContent = `Відображено ${list.length} / ${DB.getAll().length}`;
  }

  if (!tbody) return;

  tbody.innerHTML = '';

  list.forEach(u => {
    const tr = document.createElement('tr');

    const td = (html) => {
      const c = document.createElement('td');
      c.innerHTML = html;
      tr.appendChild(c);
    };

    td(`
      <input type="checkbox" data-id="${u.id}"
      ${state.selected.has(u.id) ? 'checked' : ''}>
    `);

    td(u.id || '');
    td(`<b>${u.name || ''}</b>`);
    td(u.email || '');
    td(state.maskIp ? maskIp(u.ip) : (u.ip || ''));
    td(u.role || 'user');
    td(u.status || 'active');

    td(
      (u.violations || [])
        .map(v => `<span class="pill warn">${v.type}</span>`)
        .join(' ')
    );

    td(u.banUntil ? fmtDateTime(u.banUntil) : '');
    td(u.note || '');

    td(`
      <button data-act="edit" data-id="${u.id}">Редагувати</button>
      <button data-act="warn" data-id="${u.id}">Попередити</button>
      <button data-act="tempban" data-id="${u.id}">Тимчасова блокування</button>
      <button data-act="ban" data-id="${u.id}">Заблокувати</button>
      <button data-act="unban" data-id="${u.id}">Розблокувати</button>

function bindRowEvents() {

    btn.onclick = () => {
      const id = btn.dataset.id;
      const act = btn.dataset.act;

      const u = DB.getAll().find(x => x.id === id);
      if (!u) return;

      if (act === 'edit') fillForm(u);
      if (act === 'warn') warn([u]);
      if (act === 'ban') ban([u]);
      if (act === 'tempban') openTempBan([u]);
      if (act === 'unban') unban([u]);
      if (act === 'del') del([u.id]);
    };
  });
}

// ===================== CHECKBOXES =====================

function bindCheckboxes() {
  $$('#tbody input[type="checkbox"]').forEach(cb => {
    cb.onchange = () => {
      const id = cb.dataset.id;

      if (cb.checked) {
        state.selected.add(id);
      } else {
        state.selected.delete(id);
      }
    };
  });
}
</script>

<script>
// ===================== CRUD =====================

function sanitize(u) {
  if (u.email && !emailRx.test(u.email)) throw new Error('некоректний email');
  if (u.ip && !(ipv4Rx.test(u.ip) || ipv6Rx.test(u.ip))) throw new Error('некоректна IP-адреса');

  return {
    ...u,
    name: (u.name || '').trim(),
    note: (u.note || '').trim(),
    role: u.role || 'user',
    status: u.status || 'active',
    violations: u.violations || [],
    banUntil: u.banUntil || null
  };
}

function saveUser(u) {
  try {
    u = sanitize(u);

    if (!u.id) u.id = uid();

    DB.upsert(u);
    log('save-user', u);

    render();
    notify('Збережено');
  } catch (e) {
    notify('Помилка: ' + e.message);
  }
}

function del(ids) {
  DB.remove(ids);
  ids.forEach(id => state.selected.delete(id));

  log('delete', ids);
  render();
}

// ===================== MODERATION =====================

function warn(users) {
  const reason = prompt('Причина попередження');
  if (!reason) return;

  const all = DB.getAll();

  users.forEach(u => {
    const i = all.findIndex(x => x.id === u.id);
    if (i >= 0) {
      all[i].status = 'warned';
      all[i].violations.push({
        type: 'warn',
        reason,
        t: now()
      });
    }
  });

  DB.saveAll(all);
  log('warn', users.map(u => u.id));
  render();
}

function ban(users) {
  const reason = prompt('Причина блокування');
  if (!reason) return;

  const all = DB.getAll();

  users.forEach(u => {
    const i = all.findIndex(x => x.id === u.id);

    if (i >= 0) {
      all[i].status = 'banned';
      all[i].banUntil = null;

      all[i].violations.push({
        type: 'ban',
        reason,
        t: now()
      });
    }
  });

  DB.saveAll(all);
  log('ban', users.map(u => u.id));
  render();
}

function unban(users) {
  const all = DB.getAll();

  users.forEach(u => {
    const i = all.findIndex(x => x.id === u.id);

    if (i >= 0) {
      all[i].status = 'active';
      all[i].banUntil = null;
    }
  });

  DB.saveAll(all);
  log('unban', users.map(u => u.id));
  render();
}

// ===================== TEMP BAN =====================

function openTempBan(users) {
  const mins = prompt('Minutes ban');
  if (!mins || isNaN(mins)) return;

  const until = now() + Number(mins) * 60000;

  const all = DB.getAll();

  users.forEach(u => {
    const i = all.findIndex(x => x.id === u.id);

    if (i >= 0) {
      all[i].status = 'banned';
      all[i].banUntil = until;

      all[i].violations.push({
        type: 'tempban',
        duration: mins,
        t: now()
      });
    }
  });

  DB.saveAll(all);
  log('tempban', { users: users.map(u => u.id), until });
  render();
}
</script>

<script>

// ===================== FORM =====================

function fillForm(u) {
  const f = $('#userForm');
  if (!f) return;

  f.id.value = u.id || '';
  f.name.value = u.name || '';
  f.email.value = u.email || '';
  f.ip.value = u.ip || '';
  f.note.value = u.note || '';
  f.role.value = u.role || 'user';
}

function bindForm() {
  const form = $('#userForm');
  if (!form) return;

  form.onsubmit = (e) => {
    e.preventDefault();

    const u = Object.fromEntries(new FormData(form));
    saveUser(u);

    form.reset();
  };
}
function showLogin() {
  const box = document.createElement('div');

  box.style.cssText = `
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999999;

    background:
      radial-gradient(circle at 20% 20%, rgba(110,168,254,.18), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(157,255,163,.12), transparent 40%),
      linear-gradient(180deg, rgba(5,8,20,.65), rgba(11,16,32,.75));

    backdrop-filter: blur(12px);
  `;

  box.innerHTML = `
  <div class="login-glow" style="
    background: rgba(18,25,50,0.55);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 22px;
    border-radius: 16px;
    width: 300px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    color: #eef2ff;
  ">

    <div class="login-content">

      <h3 style="margin:0 0 12px 0; font-size:18px;">
        Вхід адміністратора
      </h3>

      <input id="authUser"
        placeholder="Ім'я користувача"
        style="width:100%;margin-bottom:10px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(14,21,48,.6);color:#eef2ff;outline:none"
      >

      <input id="authPass"
        type="password"
        placeholder="Пароль"
        style="width:100%;margin-bottom:10px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(14,21,48,.6);color:#eef2ff;outline:none"
      >

      <button id="authBtn"
        style="
          width:100%;
          padding:10px;
          border-radius:12px;
          border:1px solid rgba(110,168,254,.4);
          background: linear-gradient(180deg, rgba(26,36,80,.9), rgba(17,26,61,.8));
          color:#eef2ff;
          cursor:pointer;
          transition:.2s;
        "
      >
        Увійти
      </button>

      <div id="authErr"
        style="color:#ff6b6b;font-size:12px;margin-top:8px;min-height:14px"
      ></div>

    </div>
  </div>
`;

  document.body.appendChild(box);

  document.getElementById('authBtn').onclick = async () => {
    const u = document.getElementById('authUser').value;
    const p = document.getElementById('authPass').value;

    const hash = await sha256(p);

    const admin = ADMINS.find(a =>
      a.username === u && a.passwordHash === hash
    );

    if (!admin) {
      document.getElementById('authErr').textContent = 'Невірний логін або пароль';
      return;
    }

    setSession(admin);
    box.remove();
    startApp();
  };
}

 // ===================== START APP =====================

function startApp() {
  unlockUI();

  bindUI();
  bindForm();
  seed();

  render();
  renderLog();

  notify('Адміністратор увійшов');

  const btn = document.createElement('button');
  btn.textContent = 'Вийти';

  btn.style.cssText = `
    position:fixed;
    top:10px;
    right:10px;
    z-index:99999;
    padding:10px;
  `;

  btn.onclick = () => {
    clearSession();
    location.reload();
  };

  document.body.appendChild(btn);
}
// ===================== INIT =====================

(function init() {
  lockUI();

  if (isAuth()) {
    startApp();
  } else {
    showLogin();
  }
})();



// ===================== EXPORT / IMPORT =====================

function exportData() {
  const data = {
    users: DB.getAll(),
    audit: AUDIT.all()
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: 'application/json'
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup.json';
  a.click();

  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      if (data.users) DB.saveAll(data.users);
      if (data.audit) localStorage.setItem(LOG_KEY, JSON.stringify(data.audit));

      render();
      renderLog();

      notify('Імпортовано');
    } catch {
      notify('Помилка імпорту');
    }
  };

  reader.readAsText(file);
}


// ===================== CORE LOG FIX =====================

function log(action, data = null) {
  AUDIT.add({
    action,
    data,
    t: Date.now()
  });
}

// щоб не падало, якщо десь використовується
const safeGet = (fn, fallback = null) => {
  try { return fn(); } catch { return fallback; }
};

// ===================== UI EVENTS =====================

function bindUI() {
  const search = $('#search');
  const status = $('#filterStatus');
  const role = $('#filterRole');
  const mask = $('#maskIp');
  const checkAll = $('#checkAll');
  const exportBtn = $('#exportBtn');
  const importFile = $('#importFile');
  const clearLog = $('#clearLog');

  if (search) {
    search.oninput = e => {
      state.search = e.target.value;
      render();
    };
  }

  if (status) {
    status.onchange = e => {
      state.filterStatus = e.target.value;
      render();
    };
  }

  if (role) {
    role.onchange = e => {
      state.filterRole = e.target.value;
      render();
    };
  }

  if (mask) {
    mask.onchange = e => {
      state.maskIp = e.target.checked;
      render();
    };
  }

  if (checkAll) {
    checkAll.onclick = e => {
      const list = filteredUsers();

      if (e.target.checked) {
        list.forEach(u => state.selected.add(u.id));
      } else {
        state.selected.clear();
      }

      render();
    };
  }

  if (exportBtn) exportBtn.onclick = exportData;
  if (importFile) importFile.onchange = importData;

  if (clearLog) {
    clearLog.onclick = () => {
      AUDIT.clear();
      renderLog();
    };
  }
}

// ===================== SEED DATA =====================

function seed() {
  if (DB.getAll().length) return;

  DB.saveAll([
    {
      id: uid(),
      name: 'Test User',
      email: 'test@mail.com',
      ip: '192.168.0.1',
      role: 'user',
      status: 'active',
      violations: []
    }
  ]);
}

// ===================== LOG RENDER =====================

function renderLog() {
  const log = $('#log');
  if (!log) return;

  log.textContent = AUDIT.all()
  
    .map(x => `[${fmtDateTime(x.t)}] ${x.action}${x.data ? ' ' + JSON.stringify(x.data) : ''}`)
    .join('\n');
}

</script>
