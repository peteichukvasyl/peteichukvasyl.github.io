<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peteichuk | Обговорення</title>

  <link rel="stylesheet" href="css/discussionadmin.css">
  <link rel="icon" href="logotype/logotype.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

  <div class="logotype">
    <a href="index.html">P e t e i c h u k</a>
  </div>

  <div class="ccw-container">

    <h2 class="ccw-title">Служба адміністрування чату</h2>

    <!-- AUTH -->
    <div id="authSection" class="ccw-auth-form">
      <h3>Авторизація користувача</h3>

      <form id="authForm">
        <input type="text" id="authName" class="ccw-input" placeholder="Ваше ім’я" required />
        <input type="email" id="authEmail" class="ccw-input" placeholder="Ваша електронна адреса" required />
        <button type="submit" class="ccw-btn-submit">Увійти</button>
      </form>

      <h3 style="margin-top:40px;">Вхід адміністратора</h3>

      <form id="adminForm">
        <input type="password" id="adminPassword" class="ccw-input" placeholder="Пароль адміністратора" required />
        <button type="submit" class="ccw-btn-submit">Увійти як адмін</button>
      </form>
    </div>

    <!-- USER INFO -->
    <div id="userInfo" class="auth-info" style="display:none;">
      <div>
        Ви увійшли як:
        <strong id="displayName"></strong>
        <span id="displayEmail"></span>
        <span class="admin" id="adminLabel"></span>
      </div>

      <div>
        <button class="logout-btn" id="logoutBtn">Вийти</button>
        <button class="logout-btn" id="clearCommentsBtn" style="display:none;">Очистити всі</button>
      </div>
    </div>

    <!-- COMMENT FORM -->
    <form id="commentForm" class="ccw-form" style="display:none;">
      <textarea id="commentText" class="ccw-textarea" placeholder="Ваш коментар..." required></textarea>
      <button type="submit" class="ccw-btn-submit">Додати коментар</button>
    </form>

    <!-- COMMENTS -->
    <div id="commentsList" class="ccw-comments-list"></div>
    <div id="bannedList"></div>
  </div>

  <script src="js/discussionadmin.js"></script>

</body>
</html>
